[project]
name = "pytest-houdini"
dynamic = ["version"]

description = "pytest plugin for testing code in Houdini"
authors = [
    {name = "Graham Thompson", email = "captainhammy@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-datadir (>=1.8.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]

classifiers=[
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Topic :: Software Development :: Testing",
]

[project.entry-points."pytest11"]
pytest-houdini = "pytest_houdini.plugin"

[project.urls]
Documentation = "https://pytest-houdini.readthedocs.io"
Repository = "https://github.com/captainhammy/pytest-houdini"

[dependency-groups]
    docs = ["sphinx", "sphinx-rtd-theme", "sphinx-copybutton", "sphinx-pyproject", "dunamai"]
    docstrings = ["pydocstringformatter"]
    github = ["coverage", "tox"]
    isort = ["isort"]
    ruff = ["ruff"]
    test = ["pytest-cov"]
    ty = ["ty"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
    version = "0.0.0"  # Placeholder

    [tool.poetry-dynamic-versioning]
    enable = true
    vcs = "git"
    pattern = "default-unprefixed"

[tool.tox]
    env_list = ["run-tests", "ruff-check", "ruff-format-check", "isort-check", "ty", "docstring-check"]
    labels = {test = ["run-tests"], static = ["ruff-check", "ruff-format-check", "isort-check", "ty", "docstring-check"], fix = ["ruff-format-fix", "isort-run", "docstring-run"] }

    [tool.tox.env.run-tests]
        allowlist_externals = ["echo", "hython"]
        dependency_groups = ["test"]
        # Add tox packages dir as hython won't load find it by default
        set_env = {PYTHONPATH = "{envsitepackagesdir}"}
        commands = [["hython", "-m", "pytest", "tests/"]]
        commands_post = [["echo", "View test coverage report at file://{toxinidir}/coverage_html_report/index.html"]]

    [tool.tox.env.ruff-check]
        skip_install = true
        dependency_groups = ["ruff"]
        commands = [[ "ruff", "check", "--preview", "src/", "tests/"]]

    [tool.tox.env.ruff-format-check]
        skip_install = true
        dependency_groups = ["ruff"]
        commands = [[ "ruff", "format", "--preview", "--check", "--diff", "src/", "tests/"]]

    [tool.tox.env.ruff-format-fix]
        skip_install = true
        dependency_groups = ["ruff"]
        commands = [[ "ruff", "format", "--preview", "src/", "tests/"]]

    [tool.tox.env.isort-check]
        skip_install = true
        dependency_groups = ["isort"]
        commands = [[ "isort", "--check", "src/", "tests/"]]

    [tool.tox.env.isort-run]
        skip_install = true
        dependency_groups = ["isort"]
        commands = [[ "isort", "src/", "tests/"]]

    [tool.tox.env.ty]
        dependency_groups = ["ty", "test"]
        commands = [[ "ty", "check", "src/", "tests/"]]

    [tool.tox.env.docstring-check]
        skip_install = true
        dependency_groups = ["docstrings"]
        commands = [[ "pydocstringformatter", "--exit-code", "src/"]]

    [tool.tox.env.docstring-run]
        skip_install = true
        dependency_groups = ["docstrings"]
        commands = [[ "pydocstringformatter", "--write", "src/"]]

    [tool.tox.env.docs]
        allowlist_externals = ["echo"]
        dependency_groups = ["docs"]
        commands = [
            ["sphinx-apidoc", "-o", "docs/api", "src"],
            ["sphinx-build", "-b", "html", "-d", "{envtmpdir}/doctrees", "docs/", "{envtmpdir}/html"]
        ]
        commands_post = [["echo", "Docs available at file://{envtmpdir}/html/index.html"]]

[tool.pytest]
    # Disable sugar as it interferes with pytester output parsing.
    addopts = ["-p no:sugar", "--cov", "--cov-report=html", "--cov-report=xml", "--cov-fail-under=100", "--color=yes"]

[tool.coverage]
    [tool.coverage.run]
        branch = true
        source =  [
            "pytest_houdini",
        ]
        omit = [
            "*/plugin.py",
            "*/fixtures/exceptions.py"
        ]
        disable_warnings = [
            "module-not-measured",
        ]

    [tool.coverage.report]
        exclude_lines = [
            # Have to re-enable the standard pragma
            "pragma: no cover",

            # Don't complain about missing debug-only code:
            "def __repr__",
            "if self.debug",
            "if TYPE_CHECKING",

            # Don't complain if tests don't hit defensive assertion code:
            "raise AssertionError",
            "raise NotImplementedError",

            # Don't complain if non-runnable code isn't run:
            "if 0:",
            "if __name__ == .__main__.:",
        ]
        ignore_errors = true
        skip_empty = true

    [tool.coverage.html]
        directory = "coverage_html_report"

[tool.isort]
    profile = "black"
    src_paths = ["src"]
    known_houdini = ["hou"]
    sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER,HOUDINI"
    import_heading_future = "Future"
    import_heading_stdlib = "Standard Library"
    import_heading_thirdparty = "Third Party"
    import_heading_firstparty = "pytest-houdini"
    import_heading_houdini = "Houdini"
    dedup_headings = true
    indented_import_headings = false

[tool.ty]
    [tool.ty.analysis]
        allowed-unresolved-imports = ["hou"]

    [tool.ty.environment]
        root = ["./src/"]

[tool.ruff]
    line-length = 120

    [tool.ruff.lint]
        extend-select = [
            "E",  # pycodestyle
            "W",  # pycodestyle
            "UP", # pyupgrade
            "D",  # pydocstyle
            "F",  # Pyflakes
            "PL",  # Pylint
            "RSE",  # flake8-raise
            "B",  # flake8-bugbear
            "PT",  #  flake8-pytest-style
            "C90",  #  mccabe
            "TRY",  #  tryceratops
            "FLY",  #  flynt
            "PERF",  #  Perflint
            "LOG",  #  flake8-logging
            "BLE",  # flake8-blind-except
            "A",  # flake8-builtins
            "ANN",  # flake8-annotations
            "C4",  # flake8-comprehensions
            "RET",  # flake8-return
            "SIM",  # flake8-simplify
            "PYI",  # flake8-pyi
            "Q", # flake8-quotes
            "TCH",  # flake8-type-checking
            "PTH",  # flake8-use-pathlib
            "RUF",  # Ruff specific
            "FBT",  # flake8-boolean-trap
            "FURB",  # refurb
        ]
        ignore = [
            "D104",  # Missing docstring in public module
            "D105",  # Missing docstring in magic method
            "D107",  # Missing docstring in __init__
            "FBT001",  # Boolean type hint
            "I001",  # Import ordering
            "PT006",  # Allow string parameter names
        ]

    [tool.ruff.lint.per-file-ignores]
        "plugin.py" = [
            "F401",  # Module level import not at top of file
        ]
        "tests/*.py" = [
            "PLR2004",  # Magic value in comparison
            "PLR6301",  # 'no-self-use' for tests
        ]

    [tool.ruff.lint.flake8-pytest-style]
        fixture-parentheses = false  # Match actual pytest recommendation with no parentheses

    [tool.ruff.lint.pydocstyle]
        convention = "google"

    [tool.ruff.lint.pylint]
        max-args = 6
