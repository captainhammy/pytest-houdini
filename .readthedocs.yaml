# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
  jobs:
      install:
         # Since the install step is overridden, pip is no longer updated automatically.
         - pip install --upgrade pip
         # Install pip-tools so we can use it to install the primary dependencies from
         # pyproject.toml via generating a requirements file and installing that.
         - pip install pip-tools
         - pip-compile -o requirements.txt pyproject.toml
         - pip install -r requirements.txt
         # Remove generated file.
         - rm requirements.txt
         # Install docs building requirements.
         - pip install --group docs

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/conf.py
